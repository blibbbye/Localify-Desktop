name: Build Localify Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Sync Localify cover system
        run: npm run sync-covers

      - name: Build Windows installer and publish release
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Localify-Desktop-Windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
